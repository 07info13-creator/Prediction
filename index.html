<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Prédiction</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;background:#090909;color:#fff;
  font-family:Arial,sans-serif;overflow:hidden;touch-action:manipulation;
}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#start{
  background:#fff;color:#111;border:0;border-radius:30px;
  padding:16px 26px;font-size:17px;
}
#listen{display:none}
#card{
  display:none;position:fixed;inset:0;width:100vw;height:100dvh;
  background:#090909;align-items:center;justify-content:center;z-index:20;
}
#cardImage{
  display:block;
  height:100dvh;width:auto;max-width:100vw;object-fit:contain;
  aspect-ratio:5/7;
}
@media (max-aspect-ratio:5/7){
  #cardImage{width:100vw;height:auto;max-height:100dvh}
}
</style>
</head>
<body>
<div id="app">
  <button id="start">Démarrer la prédiction</button>
  <div id="listen">●</div>
  <div id="card"><img id="cardImage" alt=""></div>
</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const start=document.getElementById("start");
const card=document.getElementById("card");
const cardImage=document.getElementById("cardImage");

function clean(text){
  return text.toLowerCase()
    .replace(/œ/g,"oe").replace(/æ/g,"ae")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’']/g," ").replace(/-/g," ")
    .replace(/[.,!?;:()[\]{}]/g," ")
    .replace(/\s+/g," ").trim();
}

function detect(text){
  const t=clean(text);
  // "sis" correspond à la prononciation française de « six ».
  const spoken=t
    .replace(/\b(?:6|six|sis|sisse|sixe|cisse|sice|cyss|cys|siss)\b/g,"six");
  let r=null,s=null;

  const ranks=[
    [/\b(?:10|dix|ten)\b/,"10"],
    [/\b(?:9|neuf|nine)\b/,"9"],
    [/\b(?:8|huit|eight)\b/,"8"],
    [/\b(?:7|sept|seven)\b/,"7"],
    [/\b(?:6|six|sis|sisse|sixe|cisse|sice|cyss|cys|siss)\b/,"6"],
    [/\b(?:5|cinq|five)\b/,"5"],
    [/\b(?:4|quatre|four)\b/,"4"],
    [/\b(?:3|trois|three)\b/,"3"],
    [/\b(?:2|deux|two)\b/,"2"],
    [/\b(?:1|as|ace|un|une)\b/,"A"],
    [/\b(?:valet|jack|j)\b/,"J"],
    [/\b(?:dame|queen|q)\b/,"Q"],
    [/\b(?:roi|king|k)\b/,"K"]
  ];
  for(const [re,val] of ranks){if(re.test(spoken)){r=val;break}}

  if(/\b(?:coeur|coeurs|heart|hearts)\b/.test(spoken)) s="H";
  else if(/\b(?:carreau|carreaux|diamond|diamonds)\b/.test(spoken)) s="D";
  else if(/\b(?:trefle|trefles|trèfle|trèfles|club|clubs)\b/.test(spoken)) s="C";
  else if(/\b(?:pique|piques|spade|spades)\b/.test(spoken)) s="S";

  if(!r && s && /(?:^|\s)(?:6|six|sis|sisse|sixe|cisse|sice|cyss|cys|siss)(?:\s|$)/.test(t)){
    r="6";
  }
  return r&&s ? r+s : null;
}

function cardUrl(code){
  if(localFaceCards[code]) return localFaceCards[code];
  const rank=code.slice(0,-1), suit=code.slice(-1);
  return "https://webisso.github.io/playing-cards/svg/"
    +rankName[rank]+"_of_"+suitName[suit]+".svg";
}

let rec=null,detected=null,listening=false,restarting=false;
let listenTimer=null;
let listenUntil=0;

function preloadCard(code){
  const img=new Image();
  img.onload=()=>{ if(detected===code) cardImage.dataset.ready="1"; };
  img.src=cardUrl(code);
  cardImage.src=img.src;
}

function safeRestart(){
  try{if(rec)rec.start()}catch(e){}
}

async function enterFullscreen(){
  try{
    if(!document.fullscreenElement && document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
    }
  }catch(e){}
}

function startListening(){
  detected=null;
  cardImage.dataset.ready="0";
  cardImage.removeAttribute("src");

  listenUntil=Date.now()+120000;
  if(listenTimer)clearTimeout(listenTimer);
  listenTimer=setTimeout(()=>{
    listenUntil=0;
    try{if(rec)rec.stop()}catch(e){}
    listening=false;
  },120000);

  if(!SR)return;

  try{
    rec=new SR();
    rec.lang="fr-FR";
    rec.continuous=true;
    rec.interimResults=false;
    rec.maxAlternatives=8;

    rec.onstart=()=>{
      listening=true;
      start.style.display="none";
    };

    rec.onresult=e=>{
      for(let n=e.results.length-1;n>=0;n--){
        const result=e.results[n];
        if(!result)continue;
        for(let i=0;i<result.length;i++){
          const spoken=(result[i]?.transcript||"").trim();
          const found=detect(spoken);
          if(found && !detected){
            detected=found;
            preloadCard(found);
            try{if(rec)rec.stop()}catch(err){}
            listening=false;
            reveal();
            return;
          }
        }
      }
    };

    rec.onerror=()=>{
      listening=false;
      if(Date.now()<listenUntil && !detected)
        setTimeout(()=>{if(!detected)safeRestart()},400);
    };

    rec.onend=()=>{
      listening=false;
      if(detected)return;
      if(Date.now()<listenUntil && !restarting){
        restarting=true;
        setTimeout(()=>{
          restarting=false;
          if(!detected && Date.now()<listenUntil)safeRestart();
        },350);
      }
    };

    rec.start();
  }catch(e){}
}

start.onclick=async()=>{
  await enterFullscreen();
  startListening();
};

function reveal(){
  if(!detected)return;
  try{if(rec)rec.stop()}catch(e){}
  listening=false;
  if(listenTimer)clearTimeout(listenTimer);
  listenUntil=0;

  /* La carte seule occupe l'écran. Aucun texte ni bouton. */
  card.style.display="flex";
}

/* Tap sur la carte : retour à l'écran de départ pour une nouvelle prédiction. */
card.addEventListener("click",()=>{
  card.style.display="none";
  detected=null;
  cardImage.removeAttribute("src");
  start.style.display="block";
});
</script>
