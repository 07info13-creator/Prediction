<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prédiction</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;background:#090909;
  color:#fff;font-family:Arial,sans-serif;overflow:hidden;
  touch-action:manipulation;
}
#app{
  width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;flex-direction:column;text-align:center;
}
#start{
  background:#fff;color:#111;border:0;border-radius:30px;
  padding:16px 26px;font-size:17px;
}
#prediction,#instruction,#listen,#status,#again{display:none}

/* Révélation : carte de vraies proportions 5:7, plein écran. */
#card{
  display:none;
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#090909;
  align-items:center;
  justify-content:center;
  z-index:20;
}
#cardSvg{
  display:block;
  height:100vh;
  width:auto;
  max-width:100vw;
  aspect-ratio:5/7;
}
@media (max-aspect-ratio:5/7){
  #cardSvg{width:100vw;height:auto;max-height:100vh}
}
</style>
</head>
<body>
<div id="app">
  <button id="start">Démarrer la prédiction</button>
  <div id="listen">●</div>
  <div id="status"></div>
  <div id="card"><svg id="cardSvg" viewBox="0 0 500 700" aria-hidden="true"></svg></div>
  <button id="again" aria-hidden="true"></button>
</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const start=document.getElementById("start");
const listen=document.getElementById("listen");
const status=document.getElementById("status");
const card=document.getElementById("card");
const svg=document.getElementById("cardSvg");

const ranks={
  "as":"A","ace":"A","un":"A","une":"A","1":"A",
  "deux":"2","two":"2","2":"2",
  "trois":"3","three":"3","3":"3",
  "quatre":"4","four":"4","4":"4",
  "cinq":"5","five":"5","5":"5",
  "six":"6","6":"6",
  "sept":"7","seven":"7","7":"7",
  "huit":"8","eight":"8","8":"8",
  "neuf":"9","nine":"9","9":"9",
  "dix":"10","ten":"10","10":"10",
  "valet":"J","jack":"J","j":"J",
  "dame":"Q","queen":"Q","q":"Q",
  "roi":"K","king":"K","k":"K"
};

const suits={
  "coeur":"H","coeurs":"H","heart":"H","hearts":"H",
  "carreau":"D","carreaux":"D","diamond":"D","diamonds":"D",
  "trèfle":"C","trèfles":"C","trefle":"C","trefles":"C","tref":"C",
  "club":"C","clubs":"C",
  "pique":"S","piques":"S","spade":"S","spades":"S"
};

function clean(text){
  return text.toLowerCase()
    .replace(/œ/g,"oe").replace(/æ/g,"ae")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’']/g," ").replace(/-/g," ")
    .replace(/[.,!?;:()[\]{}]/g," ")
    .replace(/\s+/g," ").trim();
}

function detect(text){
  const t=clean(text);
  let r=null,s=null;
  const rankTests=[
    [/\b(?:10|dix|ten)\b/,"10"],[ /\b(?:9|neuf|nine)\b/,"9"],
    [/\b(?:8|huit|eight)\b/,"8"],[ /\b(?:7|sept|seven)\b/,"7"],
    [/\b(?:6|six)\b/,"6"],[ /\b(?:5|cinq|five)\b/,"5"],
    [/\b(?:4|quatre|four)\b/,"4"],[ /\b(?:3|trois|three)\b/,"3"],
    [/\b(?:2|deux|two)\b/,"2"],[ /\b(?:1|as|ace|un|une)\b/,"A"],
    [/\b(?:valet|jack|j)\b/,"J"],[ /\b(?:dame|queen|q)\b/,"Q"],
    [/\b(?:roi|king|k)\b/,"K"]
  ];
  for(const [re,val] of rankTests){ if(re.test(t)){r=val;break;} }
  if(/\b(?:coeur|coeurs|heart|hearts)\b/.test(t)) s="H";
  else if(/\b(?:carreau|carreaux|diamond|diamonds)\b/.test(t)) s="D";
  else if(/\b(?:trefle|trefles|club|clubs)\b/.test(t)) s="C";
  else if(/\b(?:pique|piques|spade|spades)\b/.test(t)) s="S";
  return r&&s ? r+s : null;
}

let rec=null, detected=null, listening=false, listenTimer=null, restarting=false;
let orientationArmed=false, revealTimer=null;
window.predictionListenUntil=0;

function startListening(){
  detected=null; restarting=false; orientationArmed=false;
  if(revealTimer) clearTimeout(revealTimer);
  window.predictionListenUntil=Date.now()+120000;
  if(listenTimer) clearTimeout(listenTimer);
  listenTimer=setTimeout(()=>{
    window.predictionListenUntil=0;
    try{if(rec)rec.stop()}catch(e){}
    listening=false;
  },120000);

  if(!SR) return;

  try{
    rec=new SR();
    rec.lang="fr-FR";
    rec.continuous=true;
    rec.interimResults=false;
    rec.maxAlternatives=8;

    rec.onstart=()=>{
      listening=true;
      start.style.display="none";
      listen.style.display="none";
    };

    rec.onresult=e=>{
      const result=e.results[e.results.length-1];
      if(!result) return;

      const candidates=[];
      for(let i=0;i<result.length;i++){
        if(result[i] && result[i].transcript)
          candidates.push(result[i].transcript.trim());
      }

      let found=null;
      for(const text of candidates){
        const c=detect(text);
        if(c){found=c;break;}
      }

      if(found && !detected){
        detected=found;
        /* La carte est mémorisée puis le micro s'arrête :
           aucune écoute inutile après reconnaissance. */
        try{if(rec)rec.stop()}catch(e){}
        listening=false;
        armFlipReveal();
      }
    };

    rec.onerror=()=>{
      listening=false;
      if(Date.now()<window.predictionListenUntil && !detected){
        setTimeout(()=>{ if(!detected) safeRestart(); },400);
      }
    };

    rec.onend=()=>{
      listening=false;
      if(detected) return;
      if(Date.now()<window.predictionListenUntil && !restarting){
        restarting=true;
        setTimeout(()=>{
          restarting=false;
          if(!detected && Date.now()<window.predictionListenUntil) safeRestart();
        },350);
      }
    };

    rec.start();
  }catch(e){}
}

function safeRestart(){
  try{if(rec)rec.start()}catch(e){}
}

function armFlipReveal(){
  phoneWasFaceDown=false;
  orientationArmed=false;
  if(revealTimer) clearTimeout(revealTimer);
  /* Laisse le temps de poser le téléphone avant d'armer le geste. */
  setTimeout(()=>{
    if(detected) orientationArmed=true;
  },1500);
}

let phoneWasFaceDown=false;

function handleOrientation(e){
  if(!detected || !orientationArmed) return;
  if(typeof e.beta!=="number") return;

  /* Le geste attendu est : téléphone écran vers le bas, puis retourné
     écran vers le haut. On ne révèle donc pas prématurément quand il est
     simplement posé face contre la table. */
  // Seuils volontairement plus tolérants pour accepter un retournement imparfait.
  const faceUp=Math.abs(e.beta)<85;
  const faceDown=Math.abs(e.beta)>95;

  if(faceDown){
    phoneWasFaceDown=true;
  }else if(faceUp && phoneWasFaceDown){
    phoneWasFaceDown=false;
    orientationArmed=false;
    if(revealTimer) clearTimeout(revealTimer);
    revealTimer=setTimeout(()=>{
      if(detected) reveal();
    },250);
  }
}

window.addEventListener("deviceorientation",handleOrientation);
window.addEventListener("deviceorientationabsolute",handleOrientation);

/* Sur certains Android récents, le capteur demande une permission. */
async function requestOrientationPermission(){
  try{
    if(typeof DeviceOrientationEvent!=="undefined" &&
       typeof DeviceOrientationEvent.requestPermission==="function"){
      const p=await DeviceOrientationEvent.requestPermission();
      if(p!=="granted") return false;
    }
  }catch(e){}
  return true;
}

start.onclick=async()=>{
  await requestOrientationPermission();
  startListening();
};

/* ---------- Dessin d'un jeu de cartes classique ---------- */

const NS="http://www.w3.org/2000/svg";
const RED="#d71920", BLACK="#111";
const suitSymbol={H:"♥",D:"♦",C:"♣",S:"♠"};

function el(tag,attrs={},parent=svg){
  const n=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs)) n.setAttribute(k,v);
  parent.appendChild(n);
  return n;
}
function text(x,y,str,size,weight="700",fill=BLACK,anchor="middle",parent=svg){
  return el("text",{x,y,"font-family":"Georgia,Times New Roman,serif","font-size":size,"font-weight":weight,fill,"text-anchor":anchor},parent).textContent=str;
}
function pip(x,y,suit,size=48,parent=svg){
  text(x,y,suitSymbol[suit],size,"700",suit==="H"||suit==="D"?RED:BLACK,"middle",parent);
}
function roundedRect(x,y,w,h,rx,fill,stroke,sw,parent=svg){
  el("rect",{x,y,width:w,height:h,rx,fill,stroke,"stroke-width":sw},parent);
}

const pipPositions={
  "2":[[250,205],[250,495]],
  "3":[[250,195],[250,350],[250,505]],
  "4":[[165,205],[335,205],[165,495],[335,495]],
  "5":[[165,205],[335,205],[250,350],[165,495],[335,495]],
  "6":[[165,190],[335,190],[165,350],[335,350],[165,510],[335,510]],
  "7":[[165,180],[335,180],[250,265],[165,420],[335,420],[165,540],[335,540]],
  "8":[[165,175],[335,175],[250,260],[165,350],[335,350],[250,440],[165,525],[335,525]],
  "9":[[165,170],[335,170],[165,275],[335,275],[250,350],[165,425],[335,425],[165,530],[335,530]],
  "10":[[165,165],[335,165],[250,235],[165,300],[335,300],[250,350],[165,400],[335,400],[250,465],[165,535],[335,535]]
};

function drawPips(rank,suit){
  const pts=pipPositions[rank]||[];
  const g=el("g",{});
  pts.forEach(([x,y],i)=>{
    /* In a traditional layout, the lower half is inverted. */
    const lower=y>350;
    const t=text(x,y+(lower?18:0),suitSymbol[suit],44,"700",suit==="H"||suit==="D"?RED:BLACK,"middle",g);
    if(lower) t.setAttribute("transform",`rotate(180 ${x} ${y})`);
  });
}

function drawIndex(rank,suit,x,y,scale=1,rot=0){
  const g=el("g",{transform:`translate(${x} ${y}) rotate(${rot}) scale(${scale})`});
  text(0,25,rank,55,"700",suit==="H"||suit==="D"?RED:BLACK,"middle",g);
  text(0,72,suitSymbol[suit],42,"700",suit==="H"||suit==="D"?RED:BLACK,"middle",g);
}

function drawCourt(rank,suit){
  const red=suit==="H"||suit==="D";
  const main=red?RED:BLACK;
  const gold="#e8bd28", blue="#1f5aaa", white="#fff";
  const g=el("g",{});

  /* Cadre intérieur de la carte de cour. Les personnages sont dessinés
     dans deux zones séparées afin de ne jamais dépasser du cadre. */
  roundedRect(42,62,416,576,18,white,"#d4d4d4",3,g);
  roundedRect(70,92,360,516,10,white,blue,6,g);
  el("rect",{x:78,y:100,width:344,height:250,rx:7,fill:gold},g);
  el("rect",{x:78,y:350,width:344,height:250,rx:7,fill:gold},g);
  el("rect",{x:94,y:116,width:312,height:218,rx:5,fill:white},g);
  el("rect",{x:94,y:366,width:312,height:218,rx:5,fill:white},g);

  function figure(y,flip){
    const tr=flip?`translate(0 ${y+390}) scale(1 -1)`:`translate(0 ${y})`;
    const q=el("g",{transform:tr},g);

    /* Silhouette compacte : toute la figure tient dans ~190 unités. */
    el("path",{d:"M145 185 Q154 125 205 105 Q250 88 295 105 Q346 125 355 185 L330 205 L170 205 Z",fill:blue,stroke:BLACK,"stroke-width":5},q);
    el("path",{d:"M184 175 Q205 115 250 108 Q295 115 316 175 L300 205 L200 205 Z",fill:main,stroke:BLACK,"stroke-width":5},q);

    /* Visage */
    el("ellipse",{cx:250,cy:130,rx:42,ry:46,fill:"#f3d0a9",stroke:BLACK,"stroke-width":5},q);

    /* Coiffure / couronne */
    if(rank==="K"){
      el("path",{d:"M210 116 Q250 78 290 116 L285 96 Q250 75 215 96 Z",fill:gold,stroke:BLACK,"stroke-width":4},q);
      el("circle",{cx:218,cy:94,r:4,fill:main},q);
      el("circle",{cx:282,cy:94,r:4,fill:main},q);
    }else if(rank==="Q"){
      el("path",{d:"M207 116 Q250 68 293 116 L286 91 Q250 69 214 91 Z",fill:gold,stroke:BLACK,"stroke-width":4},q);
      el("circle",{cx:250,cy:80,r:5,fill:main},q);
    }else{
      el("path",{d:"M208 113 Q250 70 292 113 L284 91 Q250 73 216 91 Z",fill:main,stroke:BLACK,"stroke-width":4},q);
    }
    el("path",{d:"M211 120 Q220 82 250 82 Q280 82 289 120 Q274 101 250 101 Q226 101 211 120",fill:BLACK},q);
    el("circle",{cx:235,cy:130,r:4,fill:BLACK},q);
    el("circle",{cx:265,cy:130,r:4,fill:BLACK},q);
    el("path",{d:"M238 149 Q250 156 262 149",fill:"none",stroke:BLACK,"stroke-width":4,"stroke-linecap":"round"},q);

    /* Bras / manches */
    el("path",{d:"M155 145 L112 192 L150 210 L190 164 Z",fill:blue,stroke:BLACK,"stroke-width":5},q);
    el("path",{d:"M345 145 L388 192 L350 210 L310 164 Z",fill:blue,stroke:BLACK,"stroke-width":5},q);

    /* Col et plastron */
    el("path",{d:"M183 156 Q250 188 317 156 L306 180 Q250 204 194 180 Z",fill:gold,stroke:BLACK,"stroke-width":4},q);
    el("path",{d:"M214 178 L286 178 L296 205 L204 205 Z",fill:blue,stroke:BLACK,"stroke-width":4},q);
    text(250,198,suitSymbol[suit],31,"700",main,"middle",q);

    /* Petit emblème propre à la figure */
    if(rank==="J"){
      el("path",{d:"M225 180 L250 162 L275 180 L267 203 L233 203 Z",fill:white,stroke:BLACK,"stroke-width":3},q);
      el("path",{d:"M250 165 L250 201",stroke:gold,"stroke-width":5},q);
    }else if(rank==="Q"){
      el("circle",{cx:250,cy:193,r:11,fill:gold,stroke:BLACK,"stroke-width":3},q);
      text(250,199,"Q",15,"700",main,"middle",q);
    }else{
      el("path",{d:"M232 181 L268 181 L263 204 L237 204 Z",fill:gold,stroke:BLACK,"stroke-width":3},q);
      el("path",{d:"M250 181 L250 204",stroke:main,"stroke-width":4},q);
    }
  }

  /* Deux figures séparées, l'une au-dessus de l'autre. */
  figure(128,false);
  figure(262,true);

  /* Indices classiques dans les coins. */
  text(48,82,rank,58,"700",main,"middle",g);
  text(48,126,suitSymbol[suit],40,"700",main,"middle",g);
  const bottom=el("g",{transform:"rotate(180 452 618)"},g);
  text(48,82,rank,58,"700",main,"middle",bottom);
  text(48,126,suitSymbol[suit],40,"700",main,"middle",bottom);
}

function renderCard(code){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const rank=code.slice(0,-1), suit=code.slice(-1);
  const red=suit==="H"||suit==="D";
  const ink=red?RED:BLACK;

  /* Carte conservant exactement le ratio 5:7 et occupant tout l'écran. */
  roundedRect(5,5,490,690,30,"#fff","#d0d0d0",2);
  roundedRect(18,18,464,664,24,"none","#eeeeee",1);

  if(rank==="J"||rank==="Q"||rank==="K"){
    drawCourt(rank,suit);
  }else{
    text(52,72,rank,58,"700",ink,"middle");
    text(52,119,suitSymbol[suit],40,"700",ink,"middle");
    const corner=el("g",{transform:"rotate(180 448 628)"});
    text(52,72,rank,58,"700",ink,"middle",corner);
    text(52,119,suitSymbol[suit],40,"700",ink,"middle",corner);
    if(rank==="A") pip(250,385,suit,220);
    else drawPips(rank,suit);
  }
}

function reveal(){
  if(!detected) return;
  try{if(rec)rec.stop()}catch(e){}
  listening=false;
  if(listenTimer)clearTimeout(listenTimer);
  window.predictionListenUntil=0;
  orientationArmed=false;
  renderCard(detected);
  card.style.display="flex";
}

/* Après révélation, un tap discret permet de préparer une nouvelle prédiction.
   Il n'y a aucun texte ni bouton affiché sur la carte. */
card.addEventListener("click",()=>{
  card.style.display="none";
  detected=null;
  orientationArmed=false;
  if(revealTimer)clearTimeout(revealTimer);
  start.style.display="block";
});

</script>
</body>
</html>
