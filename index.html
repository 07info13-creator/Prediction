<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prédiction</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#app{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
#prediction{font-size:28px;letter-spacing:5px}
#instruction{margin-top:22px;font-size:15px;opacity:.65;max-width:340px;line-height:1.5}
#start{margin-top:28px;background:#fff;color:#111;border:0;border-radius:28px;padding:15px 25px;font-size:17px}
#listen{display:none;font-size:18px;opacity:.8}
#status{display:none;margin-top:14px;font-size:13px;opacity:.55;max-width:340px;line-height:1.4}
#card{display:none;width:min(76vw,430px);aspect-ratio:2/3;background:#fff;border-radius:22px;
align-items:center;justify-content:center;box-shadow:0 8px 45px #000}
#cardText{font-size:min(28vw,155px);font-weight:bold}
#again{display:none;position:absolute;bottom:24px;border:0;background:#333;color:#fff;border-radius:22px;padding:10px 16px}
.red{color:#c00}.black{color:#111}
</style>
</head>
<body>
<div id="app">
  <div id="prediction">PRÉDICTION</div>
  <div id="instruction">Autorise le microphone quand Chrome le demande, puis donne ta prédiction à voix haute.</div>
  <button id="start">Démarrer la prédiction</button>
  <div id="listen">● Écoute…</div>
  <div id="status"></div>
  <div id="card"><div id="cardText"></div></div>
  <button id="again">Nouvelle prédiction</button>
</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const prediction=document.getElementById("prediction");
const instruction=document.getElementById("instruction");
const start=document.getElementById("start");
const listen=document.getElementById("listen");
const status=document.getElementById("status");
const card=document.getElementById("card");
const cardText=document.getElementById("cardText");
const again=document.getElementById("again");

const ranks={
"as":"A","ace":"A","deux":"2","two":"2","trois":"3","three":"3","quatre":"4","four":"4",
"cinq":"5","five":"5","six":"6","sept":"7","seven":"7","huit":"8","eight":"8",
"neuf":"9","nine":"9","dix":"10","ten":"10","valet":"J","jack":"J","dame":"Q","queen":"Q",
"roi":"K","king":"K"
};
const suits={
"coeur":"♥","coeurs":"♥","heart":"♥","hearts":"♥",
"carreau":"♦","carreaux":"♦","diamond":"♦","diamonds":"♦",
"trèfle":"♣","trèfles":"♣","trefle":"♣","trefles":"♣","club":"♣","clubs":"♣",
"pique":"♠","piques":"♠","spade":"♠","spades":"♠"
};

function detect(text){
  text=text.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’']/g," ").replace(/-/g," ");
  const words=text.split(/\s+/);
  let r=null,s=null;
  for(const w of words){
    if(ranks[w]) r=ranks[w];
    if(suits[w]) s=suits[w];
  }
  return r&&s?r+s:null;
}

let rec=null, detected=null, listening=false;

function showStatus(msg){
  status.textContent=msg;
  status.style.display="block";
}

function startListening(){
  if(!SR){
    instruction.textContent="La reconnaissance vocale n'est pas disponible ici. Ouvre ce fichier dans Google Chrome sur Android.";
    showStatus("SpeechRecognition / webkitSpeechRecognition est indisponible.");
    return;
  }

  // SpeechRecognition sur Android/Chrome doit être lancé directement
  // depuis une action utilisateur.
  try{
    rec=new SR();
    rec.lang="fr-FR";
    rec.continuous=true;
    rec.interimResults=true;
    rec.maxAlternatives=5;

    rec.onstart=()=>{
      listening=true;
      prediction.style.display="none";
      instruction.style.display="none";
      start.style.display="none";
      listen.style.display="block";
      showStatus("Microphone actif. Dis par exemple : « dame de cœur ».");
    };

    rec.onaudiostart=()=>{
      showStatus("Microphone actif — je t'écoute…");
    };

    rec.onresult=e=>{
      let combined="";
      for(let i=0;i<e.results.length;i++){
        for(let j=0;j<e.results[i].length;j++){
          combined+=" "+e.results[i][j].transcript;
        }
      }

      const c=detect(combined);
      if(c){
        detected=c;
        showStatus("Carte reconnue. Tu peux maintenant retourner le téléphone.");
      }else{
        showStatus("J'entends : « "+combined.trim()+" »");
      }
    };

    rec.onerror=e=>{
      listening=false;
      console.log("SpeechRecognition error:",e.error,e.message);

      if(e.error==="not-allowed" || e.error==="service-not-allowed"){
        instruction.textContent="Chrome bloque l'accès au microphone. Vérifie l'autorisation du microphone pour Chrome, puis recharge la page.";
      }else if(e.error==="audio-capture"){
        instruction.textContent="Le microphone n'est pas accessible. Vérifie qu'aucune autre application ne l'utilise.";
      }else if(e.error==="network"){
        instruction.textContent="La reconnaissance vocale Chrome nécessite une connexion réseau sur cet appareil.";
      }else{
        instruction.textContent="La reconnaissance vocale a rencontré un problème (« "+e.error+" »). Appuie sur Nouvelle prédiction pour réessayer.";
      }

      instruction.style.display="block";
      listen.style.display="none";
      start.style.display="block";
      showStatus("Erreur micro : "+e.error);
    };

    rec.onend=()=>{
      listening=false;
      // Certains Chrome Android arrêtent automatiquement continuous=true.
      // On redémarre tant qu'une carte n'a pas été reconnue.
      if(!detected && document.visibilityState==="visible"){
        setTimeout(()=>{
          if(!detected && !listening){
            try{ rec.start(); }catch(e){}
          }
        },300);
      }
    };

    rec.start();

  }catch(e){
    console.error(e);
    instruction.textContent="Impossible de démarrer le microphone. Ouvre la page dans Google Chrome et autorise le microphone.";
    instruction.style.display="block";
    showStatus("Erreur de démarrage : "+e.message);
    start.style.display="block";
    listen.style.display="none";
  }
}

function reveal(){
  if(!detected){
    instruction.textContent="Aucune carte reconnue. Appuie sur « Nouvelle prédiction » et recommence.";
    instruction.style.display="block";
    listen.style.display="none";
    start.style.display="none";
    again.style.display="block";
    return;
  }

  try{rec.stop()}catch(e){}
  listening=false;
  listen.style.display="none";
  status.style.display="none";
  cardText.textContent=detected;
  cardText.className=(detected.includes("♥")||detected.includes("♦"))?"red":"black";
  card.style.display="flex";
  again.style.display="block";
}

start.onclick=startListening;

// Double-tap pour révéler après que le téléphone a été posé face contre table.
document.addEventListener("dblclick",()=>reveal());

again.onclick=()=>{
  try{rec.stop()}catch(e){}
  detected=null;
  listening=false;
  card.style.display="none";
  again.style.display="none";
  prediction.style.display="block";
  instruction.style.display="block";
  instruction.textContent="Autorise le microphone quand Chrome le demande, puis donne ta prédiction à voix haute.";
  status.style.display="none";
  start.style.display="block";
  listen.style.display="none";
};
</script>
</body>
</html>
