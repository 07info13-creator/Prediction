<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prédiction</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#app{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
#prediction{font-size:28px;letter-spacing:5px}
#instruction{margin-top:22px;font-size:15px;opacity:.65;max-width:340px;line-height:1.5}
#start{margin-top:28px;background:#fff;color:#111;border:0;border-radius:28px;padding:15px 25px;font-size:17px}
#listen{display:none;font-size:18px;opacity:.8}
#status{display:none;margin-top:14px;font-size:13px;opacity:.55;max-width:340px;line-height:1.4}
#card{display:none;width:min(76vw,430px);aspect-ratio:2/3;background:#fff;border-radius:22px;
align-items:center;justify-content:center;box-shadow:0 8px 45px #000}
#cardText{font-size:min(28vw,155px);font-weight:bold}
#again{display:none;position:absolute;bottom:24px;border:0;background:#333;color:#fff;border-radius:22px;padding:10px 16px}
.red{color:#c00}.black{color:#111}
</style>
</head>
<body>
<div id="app">
  <div id="prediction">PRÉDICTION</div>
  <div id="instruction">Appuie sur « Démarrer la prédiction », puis dis clairement une carte, par exemple « dame de cœur ».</div>
  <button id="start">Démarrer la prédiction</button>
  <div id="listen">● Écoute…</div>
  <div id="status"></div>
  <div id="card"><div id="cardText"></div></div>
  <button id="again">Nouvelle prédiction</button>
</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

const prediction=document.getElementById("prediction");
const instruction=document.getElementById("instruction");
const start=document.getElementById("start");
const listen=document.getElementById("listen");
const status=document.getElementById("status");
const card=document.getElementById("card");
const cardText=document.getElementById("cardText");
const again=document.getElementById("again");

const ranks={
  "as":"A","ace":"A",
  "deux":"2","two":"2",
  "trois":"3","three":"3",
  "quatre":"4","four":"4",
  "cinq":"5","five":"5",
  "six":"6",
  "sept":"7","seven":"7",
  "huit":"8","eight":"8",
  "neuf":"9","nine":"9",
  "dix":"10","ten":"10",
  "valet":"J","jack":"J",
  "dame":"Q","queen":"Q",
  "roi":"K","king":"K"
};

const suits={
  "coeur":"♥","coeurs":"♥","heart":"♥","hearts":"♥",
  "carreau":"♦","carreaux":"♦","diamond":"♦","diamonds":"♦",
  "trefle":"♣","trefles":"♣","trèfle":"♣","trèfles":"♣",
  "club":"♣","clubs":"♣",
  "pique":"♠","piques":"♠","spade":"♠","spades":"♠"
};

function clean(text){
  return text.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’']/g," ")
    .replace(/-/g," ")
    .replace(/[.,!?;:()[\]{}]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function detect(text){
  const words=clean(text).split(/\s+/);
  let r=null,s=null;

  for(const w of words){
    if(ranks[w]) r=ranks[w];
    if(suits[w]) s=suits[w];
  }

  return r&&s ? r+s : null;
}

function showStatus(msg){
  status.textContent=msg;
  status.style.display="block";
}

let rec=null;
let detected=null;
let listening=false;
let gotResult=false;

function resetScreen(){
  prediction.style.display="block";
  instruction.style.display="block";
  start.style.display="block";
  listen.style.display="none";
  card.style.display="none";
  again.style.display="none";
  status.style.display="none";
}

function startListening(){
  detected=null;
  gotResult=false;

  if(!SR){
    instruction.textContent="La reconnaissance vocale n'est pas disponible dans ce navigateur. Ouvre cette page avec Google Chrome sur Android.";
    instruction.style.display="block";
    showStatus("SpeechRecognition est indisponible.");
    return;
  }

  try{
    rec=new SR();

    // Sur Android/Chrome, une écoute courte et unique est
    // beaucoup plus fiable qu'une écoute continue.
    rec.lang="fr-FR";
    rec.continuous=false;
    rec.interimResults=false;
    rec.maxAlternatives=10;

    rec.onstart=()=>{
      listening=true;
      prediction.style.display="none";
      instruction.style.display="none";
      start.style.display="none";
      listen.style.display="block";
      showStatus("Je t'écoute… Dis clairement, par exemple : « dame de cœur ».");
    };

    rec.onaudiostart=()=>{
      showStatus("Microphone actif — je t'écoute…");
    };

    rec.onspeechstart=()=>{
      showStatus("Je t'entends…");
    };

    rec.onresult=(e)=>{
      gotResult=true;

      // On prend uniquement le résultat de cette phrase.
      const result=e.results[e.results.length-1];
      let texts=[];

      for(let i=0;i<result.length;i++){
        if(result[i] && result[i].transcript){
          texts.push(result[i].transcript);
        }
      }

      const heard=texts.join(" / ").trim();
      const candidates=texts.slice();

      // Essaye aussi toutes les alternatives ensemble.
      if(heard) candidates.push(heard);

      let found=null;
      for(const t of candidates){
        found=detect(t);
        if(found) break;
      }

      if(found){
        detected=found;
        showStatus("Carte reconnue : "+found);
        setTimeout(reveal,500);
      }else if(heard){
        showStatus("J'ai entendu : « "+heard+" ». Je n'ai pas reconnu la carte.");
        instruction.textContent="Dis simplement la valeur et la couleur, par exemple « 7 de pique ».";
        instruction.style.display="block";
        listen.style.display="none";
        start.style.display="block";
      }else{
        showStatus("Je n'ai pas reçu de parole. Appuie sur « Nouvelle prédiction » et réessaie.");
        instruction.style.display="block";
        listen.style.display="none";
        start.style.display="block";
      }
    };

    rec.onnomatch=()=>{
      showStatus("Je n'ai pas compris la carte.");
      instruction.textContent="Réessaie en disant lentement : « as de pique », « 10 de carreau », « dame de cœur », etc.";
      instruction.style.display="block";
      listen.style.display="none";
      start.style.display="block";
    };

    rec.onerror=(e)=>{
      listening=false;
      console.log("SpeechRecognition error:",e.error,e.message);

      if(e.error==="not-allowed" || e.error==="service-not-allowed"){
        instruction.textContent="Chrome bloque l'accès au microphone. Vérifie l'autorisation du microphone pour ce site.";
      }else if(e.error==="audio-capture"){
        instruction.textContent="Le microphone n'est pas accessible. Vérifie qu'aucune autre application ne l'utilise.";
      }else if(e.error==="network"){
        instruction.textContent="La reconnaissance vocale de Chrome nécessite une connexion Internet sur cet appareil.";
      }else if(e.error==="no-speech"){
        instruction.textContent="Je n'ai pas entendu de parole. Appuie sur « Nouvelle prédiction » et parle après le message « Je t'écoute… ».";
      }else{
        instruction.textContent="La reconnaissance vocale a rencontré un problème (« "+e.error+" »).";
      }

      instruction.style.display="block";
      listen.style.display="none";
      start.style.display="block";
      showStatus("Erreur de reconnaissance : "+e.error);
    };

    rec.onend=()=>{
      listening=false;
      listen.style.display="none";

      // Ne pas redémarrer automatiquement : sur Android cela
      // peut casser la reconnaissance et produire un résultat vide.
      if(!gotResult && !detected){
        showStatus("Écoute terminée. Si tu n'as pas parlé, recommence.");
        start.style.display="block";
      }
    };

    // Cet appel est directement déclenché par le bouton.
    rec.start();

  }catch(e){
    console.error(e);
    listening=false;
    instruction.textContent="Impossible de démarrer la reconnaissance vocale. Recharge la page et réessaie.";
    instruction.style.display="block";
    showStatus("Erreur de démarrage : "+e.message);
    start.style.display="block";
    listen.style.display="none";
  }
}

function reveal(){
  if(!detected){
    instruction.textContent="Aucune carte reconnue. Appuie sur « Nouvelle prédiction » et recommence.";
    instruction.style.display="block";
    listen.style.display="none";
    start.style.display="none";
    again.style.display="block";
    return;
  }

  try{ if(rec) rec.stop(); }catch(e){}
  listening=false;
  listen.style.display="none";
  status.style.display="none";

  cardText.textContent=detected;
  cardText.className=(detected.includes("♥")||detected.includes("♦"))?"red":"black";
  card.style.display="flex";
  again.style.display="block";
}

start.onclick=startListening;

// Double-tap pour révéler après que le téléphone a été posé face contre table.
document.addEventListener("dblclick",()=>reveal());

again.onclick=()=>{
  try{ if(rec) rec.stop(); }catch(e){}
  detected=null;
  listening=false;
  resetScreen();
  instruction.textContent="Appuie sur « Démarrer la prédiction », puis dis clairement une carte, par exemple « dame de cœur ».";
};
</script>
</body>
</html>
