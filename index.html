<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prédiction</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;background:#090909;
  color:#fff;font-family:Arial,sans-serif;overflow:hidden;
  touch-action:manipulation;
}
#app{
  width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;flex-direction:column;text-align:center;
}
#start{
  background:#fff;color:#111;border:0;border-radius:30px;
  padding:16px 26px;font-size:17px;
}
#prediction,#instruction,#listen,#status,#again{display:none}

/* Révélation : carte de vraies proportions 5:7, plein écran. */
#card{
  display:none;
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  background:#090909;
  align-items:center;
  justify-content:center;
  z-index:20;
}
#cardSvg{
  display:block;
  height:100vh;
  width:auto;
  max-width:100vw;
  aspect-ratio:5/7;
}
@media (max-aspect-ratio:5/7){
  #cardSvg{width:96vw;height:auto;max-height:96vh}
}
</style>
</head>
<body>
<div id="app">
  <button id="start">Démarrer la prédiction</button>
  <div id="listen">●</div>
  <div id="status"></div>
  <div id="card"><svg id="cardSvg" viewBox="0 0 500 700" aria-hidden="true"></svg></div>
  <button id="again" aria-hidden="true"></button>
</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const start=document.getElementById("start");
const listen=document.getElementById("listen");
const status=document.getElementById("status");
const card=document.getElementById("card");
const svg=document.getElementById("cardSvg");

const ranks={
  "as":"A","ace":"A","un":"A","une":"A","1":"A",
  "deux":"2","two":"2","2":"2",
  "trois":"3","three":"3","3":"3",
  "quatre":"4","four":"4","4":"4",
  "cinq":"5","five":"5","5":"5",
  "six":"6","6":"6",
  "sept":"7","seven":"7","7":"7",
  "huit":"8","eight":"8","8":"8",
  "neuf":"9","nine":"9","9":"9",
  "dix":"10","ten":"10","10":"10",
  "valet":"J","jack":"J","j":"J",
  "dame":"Q","queen":"Q","q":"Q",
  "roi":"K","king":"K","k":"K"
};

const suits={
  "coeur":"H","coeurs":"H","heart":"H","hearts":"H",
  "carreau":"D","carreaux":"D","diamond":"D","diamonds":"D",
  "trèfle":"C","trèfles":"C","trefle":"C","trefles":"C","tref":"C",
  "club":"C","clubs":"C",
  "pique":"S","piques":"S","spade":"S","spades":"S"
};

function clean(text){
  return text.toLowerCase()
    .replace(/œ/g,"oe").replace(/æ/g,"ae")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’']/g," ").replace(/-/g," ")
    .replace(/[.,!?;:()[\]{}]/g," ")
    .replace(/\s+/g," ").trim();
}

function detect(text){
  const t=clean(text);
  let r=null,s=null;

  /*
     IMPORTANT : les figures sont testées AVANT les valeurs numériques.
     La reconnaissance vocale Android peut parfois transformer « valet »
     en « as », « dame » en « as », etc. Les formes phonétiques courantes
     ci-dessous permettent aussi de récupérer certaines transcriptions
     imparfaites.
  */
  const figureTests=[
    [/\b(?:valet|jack|j|valais|valait|valets)\b/,"J"],
    [/\b(?:dame|queen|q|damme|dames)\b/,"Q"],
    [/\b(?:roi|roy|king|k|rois)\b/,"K"]
  ];
  for(const [re,val] of figureTests){
    if(re.test(t)){r=val;break;}
  }

  /* Si aucune figure n'est explicitement trouvée, on analyse les autres valeurs. */
  if(!r){
    const rankTests=[
      [/\b(?:10|dix|ten)\b/,"10"],[ /\b(?:9|neuf|nine)\b/,"9"],
      [/\b(?:8|huit|eight)\b/,"8"],[ /\b(?:7|sept|seven)\b/,"7"],
      [/\b(?:6|six)\b/,"6"],[ /\b(?:5|cinq|five)\b/,"5"],
      [/\b(?:4|quatre|four)\b/,"4"],[ /\b(?:3|trois|three)\b/,"3"],
      [/\b(?:2|deux|two)\b/,"2"],[ /\b(?:1|as|ace|un|une)\b/,"A"]
    ];
    for(const [re,val] of rankTests){ if(re.test(t)){r=val;break;} }
  }

  if(/\b(?:coeur|coeurs|heart|hearts)\b/.test(t)) s="H";
  else if(/\b(?:carreau|carreaux|diamond|diamonds)\b/.test(t)) s="D";
  else if(/\b(?:trefle|trefles|club|clubs)\b/.test(t)) s="C";
  else if(/\b(?:pique|piques|spade|spades)\b/.test(t)) s="S";
  return r&&s ? r+s : null;
}

/*
   Analyse toutes les alternatives proposées par Android au lieu de prendre
   systématiquement la première. Une figure explicitement reconnue est
   prioritaire sur une mauvaise alternative du type « as ».
*/
function detectBest(candidates){
  const parsed=[];

  for(const item of candidates){
    const text=typeof item==="string" ? item : item.text;
    const confidence=typeof item==="string" ? 0 : (Number(item.confidence)||0);
    if(!text) continue;
    const code=detect(text);
    if(code) parsed.push({code,text,confidence,t:clean(text)});
  }

  if(!parsed.length) return null;

  /*
     Android peut parfois confondre un nombre avec une figure (notamment
     « sept » avec « valet »). On ne donne donc plus de priorité automatique
     aux figures. La confiance de reconnaissance reste le critère principal.
  */
  parsed.sort((a,b)=>b.confidence-a.confidence);
  let best=parsed[0];

  /*
     Si une figure et une valeur 2–10 sont en concurrence, on demande à la
     figure d'être nettement plus sûre (+0,18) avant de l'imposer. Cela évite
     précisément que « sept de pique » devienne « valet de pique » à cause
     d'une alternative Android légèrement mieux classée.
  */
  const numeric=parsed.filter(x=>/^(?:2|3|4|5|6|7|8|9|10)$/.test(x.code.slice(0,-1)));
  const figures=parsed.filter(x=>/^(?:J|Q|K)$/.test(x.code.slice(0,-1)));
  if(numeric.length && figures.length){
    const bestNumeric=numeric[0];
    const bestFigure=figures[0];
    if(bestFigure.confidence < bestNumeric.confidence + 0.18){
      best=bestNumeric;
    }else{
      best=bestFigure;
    }
  }

  return best.code;
}

let rec=null, detected=null, listening=false, listenTimer=null, restarting=false;
window.predictionListenUntil=0;

function startListening(){
  detected=null; restarting=false;
  if(listenTimer) clearTimeout(listenTimer);
  window.predictionListenUntil=Date.now()+120000;
  if(listenTimer) clearTimeout(listenTimer);
  listenTimer=setTimeout(()=>{
    window.predictionListenUntil=0;
    try{if(rec)rec.stop()}catch(e){}
    listening=false;
  },120000);

  if(!SR) return;

  try{
    rec=new SR();
    rec.lang="fr-FR";
    rec.continuous=true;
    rec.interimResults=false;
    rec.maxAlternatives=10;

    rec.onstart=()=>{
      listening=true;
      start.style.display="none";
      listen.style.display="none";
    };

    rec.onresult=e=>{
      const result=e.results[e.results.length-1];
      if(!result) return;

      const candidates=[];
      for(let i=0;i<result.length;i++){
        if(result[i] && result[i].transcript){
          candidates.push({
            text:result[i].transcript.trim(),
            confidence:result[i].confidence
          });
        }
      }

      const found=detectBest(candidates);

      if(found && !detected){
        detected=found;
        try{if(rec)rec.stop()}catch(e){}
        listening=false;

                reveal();
      }
    };

    rec.onerror=()=>{
      listening=false;
      if(Date.now()<window.predictionListenUntil && !detected){
        setTimeout(()=>{ if(!detected) safeRestart(); },400);
      }
    };

    rec.onend=()=>{
      listening=false;
      if(detected) return;
      if(Date.now()<window.predictionListenUntil && !restarting){
        restarting=true;
        setTimeout(()=>{
          restarting=false;
          if(!detected && Date.now()<window.predictionListenUntil) safeRestart();
        },350);
      }
    };

    rec.start();
  }catch(e){}
}

function safeRestart(){
  try{if(rec)rec.start()}catch(e){}
}

/* ---------- Dessin d'un jeu de cartes classique ---------- */

const NS="http://www.w3.org/2000/svg";
const RED="#d71920", BLACK="#111";
const suitSymbol={H:"♥",D:"♦",C:"♣",S:"♠"};

function el(tag,attrs={},parent=svg){
  const n=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs)) n.setAttribute(k,v);
  parent.appendChild(n);
  return n;
}
function text(x,y,str,size,weight="700",fill=BLACK,anchor="middle",parent=svg){
  return el("text",{x,y,"font-family":"Georgia,Times New Roman,serif","font-size":size,"font-weight":weight,fill,"text-anchor":anchor},parent).textContent=str;
}
function pip(x,y,suit,size=48,parent=svg){
  text(x,y,suitSymbol[suit],size,"700",suit==="H"||suit==="D"?RED:BLACK,"middle",parent);
}
function roundedRect(x,y,w,h,rx,fill,stroke,sw,parent=svg){
  el("rect",{x,y,width:w,height:h,rx,fill,stroke,"stroke-width":sw},parent);
}

const pipPositions={
  "2":[[250,205],[250,495]],
  "3":[[250,195],[250,350],[250,505]],
  "4":[[165,205],[335,205],[165,495],[335,495]],
  "5":[[165,205],[335,205],[250,350],[165,495],[335,495]],
  "6":[[165,190],[335,190],[165,350],[335,350],[165,510],[335,510]],
  "7":[[165,180],[335,180],[250,265],[165,420],[335,420],[165,540],[335,540]],
  "8":[[165,175],[335,175],[250,260],[165,350],[335,350],[250,440],[165,525],[335,525]],
  "9":[[165,170],[335,170],[165,275],[335,275],[250,350],[165,425],[335,425],[165,530],[335,530]],
  "10":[[165,165],[335,165],[250,235],[165,300],[335,300],[250,350],[165,400],[335,400],[250,465],[165,535],[335,535]]
};

function drawPips(rank,suit){
  const pts=pipPositions[rank]||[];
  const g=el("g",{});
  pts.forEach(([x,y],i)=>{
    /* In a traditional layout, the lower half is inverted. */
    const lower=y>350;
    const t=text(x,y+(lower?18:0),suitSymbol[suit],44,"700",suit==="H"||suit==="D"?RED:BLACK,"middle",g);
    if(lower) t.setAttribute("transform",`rotate(180 ${x} ${y})`);
  });
}

function drawIndex(rank,suit,x,y,scale=1,rot=0){
  const g=el("g",{transform:`translate(${x} ${y}) rotate(${rot}) scale(${scale})`});
  text(0,25,rank,55,"700",suit==="H"||suit==="D"?RED:BLACK,"middle",g);
  text(0,72,suitSymbol[suit],42,"700",suit==="H"||suit==="D"?RED:BLACK,"middle",g);
}

function figureUrl(rank,suit){
  const rankName={J:"jack",Q:"queen",K:"king"}[rank];
  const suitName={C:"clubs",D:"diamonds",H:"hearts",S:"spades"}[suit];
  return `https://commons.wikimedia.org/wiki/Special:Redirect/file/English_pattern_${rankName}_of_${suitName}.svg`;
}

function drawCourt(rank,suit){
  /*
     Les figures utilisent de vraies cartes SVG du modèle classique, plutôt
     qu'un dessin simplifié. Le fichier SVG externe est chargé comme image :
     cela évite les problèmes de redimensionnement des personnages.
  */
  const url=figureUrl(rank,suit);
  svg.setAttribute("viewBox","0 0 500 750");
  const img=el("image",{x:0,y:0,width:500,height:750,href:url,"preserveAspectRatio":"xMidYMid meet"});
  img.setAttributeNS("http://www.w3.org/1999/xlink","href",url);
}

function renderCard(code){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const rank=code.slice(0,-1), suit=code.slice(-1);
  const red=suit==="H"||suit==="D";
  const ink=red?RED:BLACK;

  if(rank==="J"||rank==="Q"||rank==="K"){
    drawCourt(rank,suit);
    return;
  }

  /* Cartes à points : on ne touche pas au modèle existant. */
  svg.setAttribute("viewBox","0 0 500 700");
  roundedRect(5,5,490,690,30,"#fff","#d0d0d0",2);
  roundedRect(18,18,464,664,24,"none","#eeeeee",1);
  text(52,72,rank,58,"700",ink,"middle");
  text(52,119,suitSymbol[suit],40,"700",ink,"middle");
  const corner=el("g",{transform:"rotate(180 448 628)"});
  text(52,72,rank,58,"700",ink,"middle",corner);
  text(52,119,suitSymbol[suit],40,"700",ink,"middle",corner);
  if(rank==="A") pip(250,385,suit,220);
  else drawPips(rank,suit);
}

function reveal(){
  if(!detected) return;
  try{if(rec)rec.stop()}catch(e){}
  listening=false;
  if(listenTimer)clearTimeout(listenTimer);
  window.predictionListenUntil=0;
  renderCard(detected);
  card.style.display="flex";
}

/* Après révélation, un tap discret permet de préparer une nouvelle prédiction.
   Il n'y a aucun texte ni bouton affiché sur la carte. */
// Démarrage du tour : le bouton lance bien la reconnaissance vocale.
start.addEventListener("click",()=>{
  startListening();
});

card.addEventListener("click",()=>{
  card.style.display="none";
  detected=null;
  if(revealTimer)clearTimeout(revealTimer);
  start.style.display="block";
});

</script>
</body>
</html>
