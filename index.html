<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prédiction — correction cœur</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#090909;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#app{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}
#prediction{font-size:28px;letter-spacing:5px}
#instruction{margin-top:22px;font-size:15px;opacity:.65;max-width:340px;line-height:1.5}
#start{margin-top:28px;background:#fff;color:#111;border:0;border-radius:28px;padding:15px 25px;font-size:17px}
#listen{display:none;font-size:18px;opacity:.8}
#status{display:none;margin-top:14px;font-size:13px;opacity:.55;max-width:340px;line-height:1.4}
#card{display:none;width:min(76vw,430px);aspect-ratio:2/3;background:#fff;border-radius:22px;align-items:center;justify-content:center;box-shadow:0 8px 45px #000}
#cardText{font-size:min(28vw,155px);font-weight:bold}
#again{display:none;position:absolute;bottom:24px;border:0;background:#333;color:#fff;border-radius:22px;padding:10px 16px}
.red{color:#c00}.black{color:#111}
</style>
</head>
<body>
<div id="app">
  <div id="prediction">PRÉDICTION</div>
  <div id="instruction">Dis simplement la valeur et la couleur, par exemple « 8 de cœur ».</div>
  <button id="start">Démarrer la prédiction</button>
  <div id="listen">● Écoute…</div>
  <div id="status"></div>
  <div id="card"><div id="cardText"></div></div>
  <button id="again">Nouvelle prédiction</button>
</div>

<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const prediction=document.getElementById("prediction");
const instruction=document.getElementById("instruction");
const start=document.getElementById("start");
const listen=document.getElementById("listen");
const status=document.getElementById("status");
const card=document.getElementById("card");
const cardText=document.getElementById("cardText");
const again=document.getElementById("again");

const ranks={
  "as":"A","ace":"A","un":"A","une":"A","1":"A",
  "deux":"2","two":"2","2":"2",
  "trois":"3","three":"3","3":"3",
  "quatre":"4","four":"4","4":"4",
  "cinq":"5","five":"5","5":"5",
  "six":"6","6":"6",
  "sept":"7","seven":"7","7":"7",
  "huit":"8","eight":"8","8":"8",
  "neuf":"9","nine":"9","9":"9",
  "dix":"10","ten":"10","10":"10",
  "valet":"J","jack":"J","j":"J",
  "dame":"Q","queen":"Q","q":"Q",
  "roi":"K","king":"K","k":"K"
};

const suits={
  "coeur":"♥","coeurs":"♥","heart":"♥","hearts":"♥",
  "carreau":"♦","carreaux":"♦","diamond":"♦","diamonds":"♦",
  "trèfle":"♣","trèfles":"♣","trefle":"♣","trefles":"♣","tref":"♣",
  "club":"♣","clubs":"♣",
  "pique":"♠","piques":"♠","spade":"♠","spades":"♠"
};

function clean(text){
  return text.toLowerCase()
    // « cœur » contient la ligature œ, que NFD ne transforme pas.
    // On la convertit explicitement afin de reconnaître « cœur » et « coeur ».
    .replace(/œ/g,"oe").replace(/æ/g,"ae")
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’']/g," ")
    .replace(/-/g," ")
    .replace(/[.,!?;:()[\]{}]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function detect(text){
  // Analyse séparément la valeur et la couleur.
  // Le mot « de » et les variantes « cœur/coeur/coeurs » sont ignorés.
  const t=clean(text);

  let r=null;
  let s=null;

  const rankTests=[
    [/\b(?:10|dix|ten)\b/,"10"],
    [/\b(?:9|neuf|nine)\b/,"9"],
    [/\b(?:8|huit|eight)\b/,"8"],
    [/\b(?:7|sept|seven)\b/,"7"],
    [/\b(?:6|six)\b/,"6"],
    [/\b(?:5|cinq|five)\b/,"5"],
    [/\b(?:4|quatre|four)\b/,"4"],
    [/\b(?:3|trois|three)\b/,"3"],
    [/\b(?:2|deux|two)\b/,"2"],
    [/\b(?:1|as|ace|un|une)\b/,"A"],
    [/\b(?:valet|jack|j)\b/,"J"],
    [/\b(?:dame|queen|q)\b/,"Q"],
    [/\b(?:roi|king|k)\b/,"K"]
  ];

  for(const [re,val] of rankTests){
    if(re.test(t)){ r=val; break; }
  }

  // « cœur » est normalisé en « coeur » par clean().
  // On accepte aussi quelques variantes que la reconnaissance vocale
  // peut produire autour du mot cœur.
  if(/\b(?:coeur|coeurs|heart|hearts)\b/.test(t)) s="♥";
  else if(/\b(?:carreau|carreaux|diamond|diamonds)\b/.test(t)) s="♦";
  else if(/\b(?:trefle|trefles|club|clubs)\b/.test(t)) s="♣";
  else if(/\b(?:pique|piques|spade|spades)\b/.test(t)) s="♠";

  // Sécurité supplémentaire : si la phrase contient clairement
  // une valeur + « cœur », on force bien la couleur cœur.
  if(r && /\b(?:coeur|coeurs|heart|hearts)\b/.test(t)) s="♥";

  return r && s ? r+s : null;
}

let rec=null, detected=null, listening=false;
let finalTranscript="";
let listenTimer=null;
let restarting=false;

function showStatus(msg){
  status.textContent=msg;
  status.style.display="block";
}

function startListening(){
  detected=null;
  finalTranscript="";
  restarting=false;

  // Fenêtre d'écoute maximale : 2 minutes.
  // La carte est mémorisée dès qu'elle est reconnue, mais n'est pas révélée
  // automatiquement : le magicien la révèle ensuite en retournant le téléphone.
  window.predictionListenUntil=Date.now()+120000;
  if(listenTimer) clearTimeout(listenTimer);
  listenTimer=setTimeout(()=>{
    window.predictionListenUntil=0;
    try{if(rec) rec.stop();}catch(e){}
    listening=false;
    listen.style.display="none";
    if(detected){
      showStatus("Carte mémorisée.");
    }else{
      showStatus("Temps d'écoute terminé. Aucune carte reconnue.");
    }
  },120000);

  if(!SR){
    instruction.textContent="La reconnaissance vocale n'est pas disponible ici. Ouvre cette page dans Google Chrome sur Android.";
    showStatus("SpeechRecognition est indisponible.");
    return;
  }

  try{
    rec=new SR();
    rec.lang="fr-FR";

    // Important : un seul résultat final.
    // Cela évite le doublage « huit huit » provoqué par
    // l'assemblage des résultats intermédiaires de Chrome.
    rec.continuous=true;
    rec.interimResults=false;
    rec.maxAlternatives=5;

    rec.onstart=()=>{
      listening=true;
      prediction.style.display="none";
      instruction.style.display="none";
      start.style.display="none";
      listen.style.display="block";
      showStatus("Microphone actif — je t'écoute…");
    };

    rec.onaudiostart=()=>{
      showStatus("Microphone actif — dis ta carte.");
    };

    rec.onspeechstart=()=>{
      showStatus("Je t'entends…");
    };

    rec.onresult=e=>{
      // Avec interimResults=false, on ne traite que le résultat final.
      const result=e.results[e.results.length-1];
      if(!result) return;

      let candidates=[];
      for(let i=0;i<result.length;i++){
        if(result[i] && result[i].transcript){
          candidates.push(result[i].transcript.trim());
        }
      }

      // Chaque alternative est testée séparément.
      // On ne les concatène JAMAIS.
      let found=null;
      let heard=candidates[0]||"";

      for(const text of candidates){
        const c=detect(text);
        if(c){
          found=c;
          heard=text;
          break;
        }
      }

      finalTranscript=heard;

      if(found){
        detected=found;
        showStatus("Carte mémorisée discrètement.");
        // L'écoute continue jusqu'à 2 minutes. La révélation se fait
        // uniquement quand le téléphone est retourné/déclenché.
      }else if(heard){
        showStatus("J'ai entendu : « "+heard+" »");
        instruction.textContent="Carte non reconnue. Essaie « 8 de cœur », « dame de trèfle », etc.";
        instruction.style.display="block";
        listen.style.display="none";
        start.style.display="block";
      }
    };

    rec.onnomatch=()=>{
      showStatus("Je n'ai pas compris la carte.");
      instruction.textContent="Réessaie en disant lentement : « 8 de cœur », « 7 de trèfle », etc.";
      instruction.style.display="block";
      listen.style.display="none";
      start.style.display="block";
    };

    rec.onerror=e=>{
      listening=false;
      console.log("SpeechRecognition error:",e.error,e.message);

      if(e.error==="not-allowed" || e.error==="service-not-allowed"){
        instruction.textContent="Chrome bloque l'accès au microphone. Vérifie l'autorisation du microphone pour ce site.";
      }else if(e.error==="audio-capture"){
        instruction.textContent="Le microphone n'est pas accessible.";
      }else if(e.error==="network"){
        instruction.textContent="La reconnaissance vocale Chrome nécessite une connexion Internet.";
      }else if(e.error==="no-speech"){
        instruction.textContent="Je n'ai pas entendu de parole. Recommence et parle après « Je t'écoute… ».";
      }else{
        instruction.textContent="Problème de reconnaissance (« "+e.error+" »). Recommence.";
      }

      instruction.style.display="block";
      listen.style.display="none";
      start.style.display="block";
      showStatus("Erreur : "+e.error);
    };

    rec.onend=()=>{
      listening=false;

      // Chrome/Android peut couper SpeechRecognition après un court silence.
      // On relance automatiquement pendant la fenêtre d'écoute, sans
      // concaténer les anciennes transcriptions.
      if(detected) return;

      if(Date.now() < window.predictionListenUntil && !restarting){
        restarting=true;
        setTimeout(()=>{
          restarting=false;
          if(!detected && Date.now() < window.predictionListenUntil){
            try{
              rec.start();
            }catch(e){
              // Un démarrage déjà en cours peut provoquer InvalidStateError.
            }
          }
        },350);
      }else{
        listen.style.display="none";
      }
    };

    rec.start();

  }catch(e){
    console.error(e);
    instruction.textContent="Impossible de démarrer la reconnaissance vocale. Recharge la page et réessaie.";
    instruction.style.display="block";
    showStatus("Erreur de démarrage.");
    start.style.display="block";
    listen.style.display="none";
  }
}

function reveal(){
  if(!detected){
    instruction.textContent="Aucune carte reconnue. Appuie sur « Nouvelle prédiction » et recommence.";
    instruction.style.display="block";
    again.style.display="block";
    return;
  }

  try{if(rec) rec.stop();}catch(e){}
  listening=false;
  listen.style.display="none";
  status.style.display="none";

  cardText.textContent=detected;
  cardText.className=(detected.includes("♥")||detected.includes("♦"))?"red":"black";
  card.style.display="flex";
  again.style.display="block";
}


let pressTimer=null;
document.addEventListener("touchstart",()=>{
  if(!detected) return;
  pressTimer=setTimeout(()=>reveal(),700);
},{passive:true});
document.addEventListener("touchend",()=>{
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
},{passive:true});

start.onclick=startListening;

again.onclick=()=>{
  if(listenTimer) clearTimeout(listenTimer);
  window.predictionListenUntil=0;
  try{if(rec) rec.stop();}catch(e){}
  detected=null;
  listening=false;
  finalTranscript="";
  card.style.display="none";
  again.style.display="none";
  prediction.style.display="block";
  instruction.style.display="block";
  instruction.textContent="Dis simplement la valeur et la couleur, par exemple « 8 de cœur ».";
  status.style.display="none";
  start.style.display="block";
  listen.style.display="none";
};
</script>
</body>
</html>
